<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <title>Star Wars</title>
  </head>
  <body>
    <div id="app">
      <div class="top">
        <div>
          <h1>{{title}}</h1>
          <small>Developed by {{userName}}</small>
        </div>
        <form @submit.prevent="searchCharacter">
          <input
            type="text"
            v-model="searchName"
            placeholder="Search for a character"
          />
          <button type="submit">Search</button>
        </form>
      </div>
      <div class="characters">
        <div class="item" v-for="item of characters" :key="item.name">
          <img title="character image" :src="item.image" :alt="item.name" />
          <p class="item-name">{{item.name}}</p>
          <div class="buttons-icons">
            <span class="material-symbols-outlined" @click="countLikes(item)">
              favorite
            </span>
            <span class="material-icons" @click="deleteCharacter(item.id)"
              >delete</span
            >
          </div>
          <p class="likes-count">Likes: {{item.likes || 0}}</p>
        </div>
      </div>
    </div>
    <script src="js/vue.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
